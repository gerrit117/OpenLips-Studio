name: Studio beta builds
permissions:
  contents: read
concurrency:
  group: studio-build-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['studio/**', 'plugins/**', 'tests/**', 'tools/**', 'packaging/**', 'requirements-ai.txt', 'requirements-ai-amd-windows.txt', 'pyproject.toml', '*.spec', '.github/workflows/studio.yml']
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14, macos-15-intel, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated Basic Pitch ONNX runtime
        run: |
          python -m pip install -r tools/basic_pitch_requirements.txt
          python -m pip install --no-deps basic-pitch==0.4.0
      - name: Test real Basic Pitch inference on original synthetic audio
        run: python plugins/basic_pitch/worker.py --self-test --output private/worker-source-smoke
      - name: Build isolated Basic Pitch worker
        run: python -m PyInstaller --noconfirm BasicPitchWorker.spec
      - name: Inventory worker dependencies and preserve license notices
        run: python tools/collect_runtime_notices.py --out dist/OpenLipsBasicPitch/licenses
      - name: Test frozen Basic Pitch worker
        if: runner.os != 'Windows'
        run: dist/OpenLipsBasicPitch/OpenLipsBasicPitch --self-test --output private/worker-frozen-smoke
      - name: Test frozen Basic Pitch worker on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & dist/OpenLipsBasicPitch/OpenLipsBasicPitch.exe --self-test --output private/worker-frozen-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install optional CPU AI runtime on Windows and Linux
        if: runner.os != 'macOS'
        run: python -m pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install optional AI dependencies
        run: python -m pip install -r requirements-ai.txt imageio-ffmpeg==0.6.0
      - name: Preserve optional AI runtime notices
        run: python tools/collect_runtime_notices.py --out build/ai-licenses
      - name: Build optional standalone AI engine
        run: python -m PyInstaller --noconfirm AIWorker.spec
      - name: Test frozen optional AI engine
        run: python -m tools.smoke_ai_worker dist/OpenLipsAI/OpenLipsAI${{ runner.os == 'Windows' && '.exe' || '' }} --out private/ai-engine-smoke
      - name: Package optional AI engine
        run: python -m tools.package_ai_runtime --target ${{ matrix.os }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libpulse0 libportaudio2 ffmpeg
      - name: Native macOS downloader media tools
        if: runner.os == 'macOS'
        run: command -v ffmpeg && command -v ffprobe || brew install ffmpeg
      - run: python -m pip install -e ".[dev]"
      - name: Package standalone Basic Pitch plugin
        run: python -m tools.package_basic_pitch_plugin
      - run: python -m pytest tests/test_studio.py tests/test_studio_timeline.py tests/test_studio_pages.py tests/test_studio_media.py tests/test_studio_release.py tests/test_studio_plugins.py tests/test_studio_tones.py tests/test_ai_runtime.py tests/test_ai_chart.py tests/test_ai_packaging.py tests/test_xenia_test_launcher.py tests/test_smart_pages.py tests/test_page_recording.py tests/test_lyric_timing.py tests/test_ultrastar_batch.py tests/test_community_client.py tests/test_community_page.py -q
        env:
          QT_QPA_PLATFORM: offscreen
          OPENLIPS_SMOKE_PLUGIN: release_assets/Basic-Pitch-0.4.0-2-${{ runner.os == 'Linux' && 'linux-x64' || runner.os == 'Windows' && 'windows-x64' || matrix.os == 'macos-14' && 'macos-arm64' || 'macos-x64' }}.opl
      - name: Build Windows native media encoder
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          mkdir private\runtime\media
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /EHsc /std:c++17 tools\media\transcode_windows.cpp /Fo:private\runtime\media\transcode_windows.obj /Fe:private\runtime\media\transcode_windows.exe
      - name: Prepare desktop notices before app-bundle signing
        run: python tools/collect_runtime_notices.py --out build/studio-licenses
      - name: Fetch pinned Windows DLC dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone https://github.com/hetelek/Velocity.git private/runtime/Velocity
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C private/runtime/Velocity checkout cf0b84cc8bbfad09c655476c6a3c762836ce1246
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C private/runtime/Velocity apply "$PWD/tools/dlc_backend/velocity-full-table.patch"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git clone https://github.com/randombit/botan.git private/runtime/botan
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C private/runtime/botan checkout 07e1cfe0a06b224bbb37ad534736924931184246
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-8.1.2-essentials_build.zip -OutFile private/runtime/ffmpeg.zip
          if ((Get-FileHash private/runtime/ffmpeg.zip -Algorithm SHA256).Hash.ToLower() -ne 'db580001caa24ac104c8cb856cd113a87b0a443f7bdf47d8c12b1d740584a2ec') { throw 'FFmpeg archive checksum mismatch' }
          Expand-Archive private/runtime/ffmpeg.zip private/runtime/usdb-media/extracted
          Copy-Item private/runtime/usdb-media/extracted/ffmpeg-8.1.2-essentials_build/LICENSE build/studio-licenses/FFmpeg-Gyan-LICENSE.txt
          Copy-Item private/runtime/usdb-media/extracted/ffmpeg-8.1.2-essentials_build/README.txt build/studio-licenses/FFmpeg-Gyan-README.txt
          Copy-Item private/runtime/Velocity/COPYING build/studio-licenses/Velocity-COPYING.txt
          Copy-Item private/runtime/botan/license.txt build/studio-licenses/Botan-LICENSE.txt
      - name: Build integrated Windows STFS backend
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          pushd private\runtime\botan
          python configure.py --cc=msvc --cpu=x86_64 --os=windows --build-targets=static --minimized-build --enable-modules=sha1,rsa,auto_rng --disable-shared-library
          if errorlevel 1 exit /b 1
          nmake
          if errorlevel 1 exit /b 1
          popd
          cmake -S tools/dlc_backend -B private/runtime/dlc-backend-build -DVELOCITY_ROOT="%CD%/private/runtime/Velocity" -DBOTAN_ROOT="%CD%/private/runtime/botan"
          if errorlevel 1 exit /b 1
          cmake --build private/runtime/dlc-backend-build --config Release
          if errorlevel 1 exit /b 1
      - name: Test automatic audio and video DLC export
        if: runner.os == 'Windows'
        run: python -m pytest tests/test_studio_dlc_media.py tests/test_build_dlc.py -q
        env:
          QT_QPA_PLATFORM: offscreen
          OPENLIPS_TEST_NATIVE_DLC: '1'
          OPENLIPS_STFS_BACKEND: private/runtime/dlc-backend-build/Release/openlips_stfs.exe
      - name: Inventory integrated downloader notices
        run: python -m tools.collect_runtime_notices --out build/download-licenses
      - name: Build and validate integrated native USDB bridge
        run: python -m tools.build_usdb_runtime
      - name: Build integrated yt-dlp worker
        run: python -m PyInstaller --noconfirm DownloadWorker.spec
      - run: python -m PyInstaller --noconfirm OpenLipsStudio.spec
      - name: Test bundled pitch model in frozen Studio
        run: python -m tools.smoke_ai_worker dist/OpenLipsStudio/OpenLipsStudio${{ runner.os == 'Windows' && '.exe' || '' }} --embedded --out private/ai-studio-smoke
      - name: Inventory desktop dependency notices
        run: python tools/collect_runtime_notices.py --out dist/OpenLipsStudio/licenses
      - name: Smoke test frozen Unix build
        if: runner.os != 'Windows'
        run: dist/OpenLipsStudio/OpenLipsStudio --smoke-test smoke.png
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Test end-to-end plugin workflow in frozen Unix app
        if: runner.os != 'Windows'
        run: dist/OpenLipsStudio/OpenLipsStudio --smoke-plugin private/gui-plugin-smoke
        env:
          QT_QPA_PLATFORM: offscreen
          OPENLIPS_SMOKE_PLUGIN: release_assets/Basic-Pitch-0.4.0-2-${{ runner.os == 'Linux' && 'linux-x64' || matrix.os == 'macos-14' && 'macos-arm64' || 'macos-x64' }}.opl
      - name: Test Linux desktop integration
        if: runner.os == 'Linux'
        run: |
          XDG_DATA_HOME="$PWD/private/desktop-smoke" sh dist/OpenLipsStudio/_internal/studio/assets/install-desktop-entry.sh
          test -f private/desktop-smoke/applications/openlips-studio.desktop
          test -f private/desktop-smoke/icons/hicolor/256x256/apps/openlips-studio.png
      - name: Test plugin runtime inside the actual macOS app bundle
        if: runner.os == 'macOS'
        run: dist/OpenLipsStudio.app/Contents/MacOS/OpenLipsStudio --smoke-plugin private/gui-plugin-app-bundle-smoke
        env:
          QT_QPA_PLATFORM: offscreen
          OPENLIPS_SMOKE_PLUGIN: release_assets/Basic-Pitch-0.4.0-2-${{ matrix.os == 'macos-14' && 'macos-arm64' || 'macos-x64' }}.opl
      - name: Smoke test frozen Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/OpenLipsStudio/OpenLipsStudio.exe -ArgumentList '--smoke-test','smoke.png' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Test end-to-end plugin workflow in frozen Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/OpenLipsStudio/OpenLipsStudio.exe -ArgumentList '--smoke-plugin','private/gui-plugin-smoke' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { Get-Content private/gui-plugin-smoke/*.txt; exit $process.ExitCode }
        env:
          QT_QPA_PLATFORM: offscreen
          OPENLIPS_SMOKE_PLUGIN: release_assets/Basic-Pitch-0.4.0-2-windows-x64.opl
      - name: Test automatic DLC export in frozen Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/OpenLipsStudio/OpenLipsStudio.exe -ArgumentList '--smoke-dlc','private/frozen-dlc-smoke' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { Get-Content private/frozen-dlc-smoke/failure.txt; exit $process.ExitCode }
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python -m tools.package_studio_release --target ${{ matrix.os }}
      - name: Build Windows installer wizard
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          python -m tools.build_studio_installer --target windows-2022
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build macOS drag-to-Applications image
        if: runner.os == 'macOS'
        run: python -m tools.build_studio_installer --target ${{ matrix.os }}
      - uses: actions/upload-artifact@v4
        with:
          name: studio-release-${{ matrix.os }}
          path: release_assets/*
          retention-days: 14
      - name: Preserve synthetic smoke diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: studio-diagnostics-${{ matrix.os }}
          path: |
            private/gui-plugin-smoke/*.txt
            private/gui-plugin-smoke/*.log
            private/gui-plugin-app-bundle-smoke/*.txt
            private/gui-plugin-app-bundle-smoke/*.log
  amd-ai:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-ai-amd-windows.txt pyinstaller
      - run: python -m tools.collect_runtime_notices --out build/amd-ai-licenses
      - run: python -m PyInstaller --noconfirm AIWorker.spec
      - run: python -m tools.package_ai_runtime --target windows-2022 --flavor amd
      - uses: actions/upload-artifact@v4
        with:
          name: studio-release-amd-ai
          path: release_assets/*
          retention-days: 14
  release:
    needs: [desktop, amd-ai]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency:
      group: studio-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: studio-release-*
          path: release_assets
          merge-multiple: true
      - name: Publish versioned beta downloads
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const source = fs.readFileSync('studio/__init__.py', 'utf8');
            const version = source.match(/__version__ = "([^"]+)"/)[1];
            if (!/^\d+\.\d+\.\d+(b\d+)?$/.test(version)) throw new Error('Invalid release version');
            const tag = 'v' + version.replace(/b(\d+)$/, '-beta.$1');
            const owner = context.repo.owner, repo = context.repo.repo;
            const files = fs.readdirSync('release_assets').filter(name => /\.(zip|tar\.gz|opl|exe|dmg|sha256)$/.test(name));
            if (files.length !== 32) throw new Error('Expected 16 binaries/archives and 16 checksum files (Studio, plugins, CPU/AMD AI engines, installers)');
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({owner, repo, tag})).data;
              try {
                const ref = (await github.rest.git.getRef({owner, repo, ref: 'tags/' + tag})).data;
                if (ref.object.sha !== context.sha) throw new Error('Version already released from another commit. Bump the app version.');
              } catch (error) {
                if (error.status !== 404 || !release.draft || release.target_commitish !== context.sha) throw error;
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({owner, repo, tag_name: tag,
                target_commitish: context.sha, name: 'OpenLips Studio ' + version.replace(/b\d+$/, ' Beta'),
                // Keep Beta in the title/tag; GitHub prereleases cannot be Latest in the sidebar.
                prerelease: false, draft: true,
                body: fs.readFileSync('CHANGELOG.md', 'utf8').split(/^## /m)[1].split(/^## /m)[0].replace(/^[^\n]*\n/, '').trim() + '\n\n' +
                      'Native Windows installer, macOS DMGs (Apple Silicon / Intel), and portable archives. Basic Pitch remains a separate .opl plugin. Optional OpenLips-AI archives contain the independent inference engine, installed automatically when needed. A separate Windows AMD ROCm engine accelerates separation and transcription on supported Radeon GPUs. No separate Python installation is needed. SwiftF0 and FFmpeg are bundled; larger separation/transcription models download on first use.\n\n' +
                      'AI drafts require manual review, especially sung lyrics. Custom DLC has been played in Number One Hits on a modified Xbox 360; Xenia DLC discovery remains under investigation. Final media encoding currently requires Windows. macOS/Linux game export needs already-compatible media.\n\n' +
                      'Technical documentation: https://github.com/' + owner + '/' + repo + '/tree/' + tag + '/docs'
              })).data;
            }
            const existing = (await github.rest.repos.listReleaseAssets({owner, repo, release_id: release.id})).data;
            for (const name of files) {
              const old = existing.find(asset => asset.name === name);
              if (old) {
                core.info('Preserving already published asset: ' + name);
                continue;
              }
              const data = fs.readFileSync('release_assets/' + name);
              await github.rest.repos.uploadReleaseAsset({owner, repo, release_id: release.id, name,
                data, headers: {'content-type': 'application/octet-stream', 'content-length': data.length}});
            }
            await github.rest.repos.updateRelease({owner, repo, release_id: release.id,
              draft: false, prerelease: false, make_latest: 'true'});
