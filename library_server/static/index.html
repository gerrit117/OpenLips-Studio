<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenLips Library</title><link rel="stylesheet" href="/app.css"><script defer src="/lucide.js"></script><script defer src="/app.js"></script></head>
<body><header><div class="header-inner"><a class="brand" href="/" aria-label="OpenLips"><img class="logo-light" src="/logo-light.png" alt="OpenLips"><img class="logo-dark" src="/logo-dark.png" alt="OpenLips"></a><span class="header-title" data-i18n="library">Library</span><div class="header-actions"><select id="language" aria-label="Language"><option value="en">English</option><option value="de">Deutsch</option></select><button id="theme" class="icon-button" title="Dark / light"><i data-lucide="sun-moon"></i></button><button id="logout" hidden class="icon-button" title="Sign out"><i data-lucide="log-out"></i></button></div></div></header>
<main><section id="signin" hidden><h1 data-i18n="signin">Sign in</h1><form id="login-form"><label for="access-key" data-i18n="key">Library access key</label><input type="password" id="access-key" required autocomplete="off"><button type="submit"><i data-lucide="log-in"></i><span data-i18n="connect">Connect</span></button></form></section>
<section id="workspace" hidden><div class="heading"><div><h1 id="library-name">Library</h1><span id="counts" class="quiet"></span></div><div class="commands"><button id="import"><i data-lucide="file-plus-2"></i><span data-i18n="import">Import song</span></button><button id="import-dlc" title="Upload DLC" class="icon-button"><i data-lucide="package-plus"></i></button><button id="refresh" class="icon-button" title="Refresh"><i data-lucide="refresh-cw"></i></button></div></div>
<nav class="tabs" aria-label="Library views"><button class="active" data-tab="songs" data-i18n="songs">Songs</button><button data-tab="outputs" data-i18n="outputs">Downloads</button><button data-tab="jobs" data-i18n="jobs">Jobs</button><button data-tab="devices" data-i18n="devices">Devices</button></nav>
<div id="songs-view" class="catalog"><div class="song-list"><div class="filter"><i data-lucide="search"></i><input id="search" type="search" placeholder="Search" aria-label="Search"></div><div class="table-scroll"><table><thead><tr><th data-i18n="artist">Artist</th><th data-i18n="title">Title</th><th data-i18n="packages">Packages</th></tr></thead><tbody id="song-rows"></tbody></table></div><p id="empty-songs" class="quiet" data-i18n="empty">No songs yet.</p></div><aside id="details"><div class="detail-head"><img id="cover" src="/logo-light.png" alt="Cover"><div><h2 id="song-title" data-i18n="select">Select a song</h2><p id="song-artist" class="quiet"></p></div></div><div id="song-controls" hidden><label for="edit-title" data-i18n="title">Title</label><input id="edit-title"><label for="edit-artist" data-i18n="artist">Artist</label><input id="edit-artist"><button id="save-meta"><i data-lucide="check"></i><span data-i18n="save">Save</span></button><dl id="song-info"></dl><div class="media-actions"><button data-media="cover"><i data-lucide="image-plus"></i><span data-i18n="cover">Cover</span></button><button data-media="audio"><i data-lucide="music"></i><span data-i18n="audio">Audio</span></button><button data-media="video"><i data-lucide="film"></i><span data-i18n="video">Video</span></button></div><h3 data-i18n="export">Export</h3><div class="export-actions"><button data-job="chart">.ols</button><button data-job="midi">MIDI</button><button data-job="lrc">LRC</button><button id="dlc" data-job="dlc">DLC</button></div><p id="codec-note" class="quiet" data-i18n="noencoder">Media conversion is not available on this server.</p><button id="remove" class="danger"><i data-lucide="trash-2"></i><span data-i18n="remove">Remove project</span></button></div></aside></div>
<input id="lyric-file" type="file" accept=".lrc" hidden><section id="outputs-view" hidden><div class="table-scroll"><table><thead><tr><th data-i18n="title">Title</th><th data-i18n="type">Type</th><th data-i18n="size">Size</th><th></th></tr></thead><tbody id="output-rows"></tbody></table></div></section>
<section id="jobs-view" hidden><div class="table-scroll"><table><thead><tr><th data-i18n="type">Job</th><th data-i18n="state">State</th><th data-i18n="progress">Progress</th></tr></thead><tbody id="job-rows"></tbody></table></div></section>
<section id="devices-view" hidden><div class="device-heading"><h2 data-i18n="devices">Devices</h2><button id="pair"><i data-lucide="link"></i><span data-i18n="pair">Pair device</span></button></div><p id="pair-code" class="pair-code" hidden></p><p id="fingerprint" class="quiet"></p><table><thead><tr><th data-i18n="device">Device</th><th data-i18n="state">State</th><th></th></tr></thead><tbody id="device-rows"></tbody></table></section>
</section><p id="status" role="status" aria-live="polite"></p></main><footer><span>OpenLips Library</span><span data-i18n="local">Private library · No analytics · Access keys stay in this browser session</span></footer><input id="song-file" type="file" accept=".txt,.lrc,.mid,.midi,.ols,.olp" hidden><input id="media-file" type="file" hidden><input id="dlc-file" type="file" hidden></body></html>
