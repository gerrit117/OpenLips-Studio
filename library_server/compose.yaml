name: openlips-library
services:
  library:
    image: ghcr.io/gerrit117/openlips-library:latest
    restart: unless-stopped
    ports:
      - "${OPENLIPS_WEB_PORT:-8765}:8765"
    environment:
      PUID: ${PUID:-10001}
      PGID: ${PGID:-10001}
    volumes:
      - library-data:/data
      - song-library:/library
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    security_opt: [no-new-privileges:true]
    pids_limit: 96
    mem_limit: 768m
    cpus: "1.0"
volumes:
  library-data:
  song-library:
