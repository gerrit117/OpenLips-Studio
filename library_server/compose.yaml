name: openlips-library
services:
  library:
    image: ghcr.io/gerrit117/openlips-library:latest
    restart: unless-stopped
    network_mode: host
    environment:
      OPENLIPS_BIND: ${OPENLIPS_BIND:?Set a specific private LAN/VPN IPv4 address}
    volumes:
      - library-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 96
    mem_limit: 768m
    cpus: "1.0"
volumes:
  library-data:
