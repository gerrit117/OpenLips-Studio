[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openlips-studio"
version = "0.3.4b1"
description = "Cross-platform Lips song creator and MIDI/UltraStar chart editor"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "mido>=1.3,<2", "qtawesome>=1.3,<2", "pyphen>=0.17,<1", "imageio-ffmpeg==0.6.0", "swift-f0[audio]==0.3.0", "yt-dlp[default]==2026.8.19", "deno==2.9.7"]
license = "GPL-3.0-or-later"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-subtests", "pyinstaller>=6,<7", "Pillow>=10,<13"]

[project.scripts]
openlips-studio = "studio.app:main"

[tool.setuptools.packages.find]
include = ["studio*", "tools*"]

[tool.setuptools.package-data]
studio = ["assets/*.png", "assets/*.ico", "assets/*.icns", "assets/*.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["private", "build", "dist"]
