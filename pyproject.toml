[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openlips-studio"
version = "0.2.0b1"
description = "Cross-platform Lips song creator and MIDI/UltraStar chart editor"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "mido>=1.3,<2", "qtawesome>=1.3,<2", "pyphen>=0.17,<1"]
license = "GPL-3.0-or-later"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-subtests", "pyinstaller>=6,<7", "Pillow>=10,<13"]

[project.scripts]
openlips-studio = "studio.app:main"

[tool.setuptools.packages.find]
include = ["studio*", "tools*"]

[tool.setuptools.package-data]
studio = ["assets/*.png", "assets/*.ico", "assets/*.icns", "assets/*.sh", "assets/*.opl"]
